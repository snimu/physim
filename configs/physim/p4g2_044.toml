# Select the model on the CLI. This file selects one published preparation explicitly.
# This configuration makes model API calls when executed.
model = "YOUR_MODEL_ID"
select = { limit = 1 }
num_rollouts = 1
max_concurrent = 1
push = false

[env.taskset]
id = "physim"

[env.taskset.task]
output_root = "outputs/r6/artifacts"
agent_image = "python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93"

[env.taskset.task.tools]
max_experiments = 1000
max_total_tu = 50000
max_validation_attempts = 128
max_submission_attempts = 128

[env.agent]
# Generous exploration defaults; increase these together for longer investigations.
max_turns = 1024
max_output_tokens = 1048576

[env.agent.timeout]
rollout = 86400

[env.agent.harness]
id = "bash"
edit = true
search = false

[env.agent.runtime]
type = "prime"
image = "python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93"
workdir = "/workspace"
cpu = 4
memory = 8
allow = []

[env.agent.retries]
max_retries = 0

[env.retries]
max_retries = 0

[env.taskset.task.tools.bundle_source]
repo = "seanpohorence/physim-worlds"
revision = "dcd6abd5eae76a47f326c70518315d2d1e101d86"
path = "bundles/p4g2_044/0c133190c1c86450f56651b47e35f0d729f6a84c7c51a4bc7d91850a9a392ff2"
