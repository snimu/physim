name: Research workspace and reference checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Build and check static documentation without installed packages
        run: |
          python3 -S scripts/build_docs.py
          python3 -S scripts/check_docs.py
      - name: Install the development workspace
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ruff check --no-force-exclude packages/blobkit/blobkit/generation.py packages/blobkit/blobkit/registry.py packages/blobkit/blobkit/cli.py
          uv run ruff format --check --no-force-exclude packages/blobkit/blobkit/generation.py packages/blobkit/blobkit/registry.py packages/blobkit/blobkit/cli.py
      - name: Installed environment and research integration
        run: uv run pytest -n auto tests -v
      - name: Blobkit package and CPU checks
        run: uv run pytest packages/blobkit/tests -m 'not accelerator and not slow' -v
      - name: Local scientific and integration checks
        run: |
          uv run python scripts/physim/validation/test_blob_round6.py --gates toy
          uv run python scripts/physim/validation/test_blob_round6_eval.py
          uv run python scripts/physim/validation/test_blob_round6_explore.py
          uv run python -m unittest discover -s scripts/physim/validation -p test_bundles.py
          uv run python -m unittest discover -s scripts/physim/validation -p test_r6_verifiers.py
      - name: Build distributions
        run: |
          uv build --package blobkit
