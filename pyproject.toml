[project]
name = "physim-development"
version = "0.1.0"
description = "Development workspace for the Physim residency taskset and blobkit"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = []

[tool.uv]
# Research development uses our editable Blobkit; the environment distribution
# itself continues to pin its public, checksummed Blobkit wheel.
override-dependencies = ["blobkit==0.3.5"]

[tool.uv.workspace]
members = ["packages/blobkit"]

[tool.uv.sources]
physim = { git = "https://github.com/swpo/residency-environments.git", rev = "a124e9bdd9bc3dde9866153207658a64e98f82e8", subdirectory = "environments/physim" }
blobkit = { workspace = true }

[dependency-groups]
dev = [
    "physim",
    "build>=1.2",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 120
extend-exclude = ["probes", "handoff", "docs", "docs_source", "packages/blobkit/blobkit", "build", "dist", "outputs"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F722", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
